<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gospels in Order</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gospels">
<meta name="theme-color" content="#1E2B4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"DM Sans";font-weight:400;font-display:swap;src:url(dm-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:500;font-display:swap;src:url(dm-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:700;font-display:swap;src:url(dm-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"DM Serif Display";font-weight:400;font-display:swap;src:url(dm-serif-display-latin-400-normal.woff2) format("woff2")}

/* One dusk palette. The sheet follows the phone's light or dark setting. */
:root{
  --sky:#1E2B4A; --sheet:#FFFFFF; --ink:#13202E; --muted:#7C8796; --line:#EEF1F4;
  --chip:#F1F3F6; --chip-sel:#FFFFFF; --ring:#B9C3CE; --accent:#2F3A6B; --accent-ink:#FFFFFF;
  --handle:#DCE2E8; --panel:#FFFFFF; --scrim:rgba(10,14,30,.45);
  --serif:"DM Serif Display", Georgia, serif; --sans:"DM Sans", -apple-system, system-ui, sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --sheet:#14162A; --ink:#ECEDF7; --muted:#8C90AE; --line:#23263F; --chip:#1F2238; --chip-sel:#14162A;
  --ring:#4A4E72; --accent:#8E9BE0; --accent-ink:#11132A; --handle:#2E3150; --panel:#1B1E35; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:linear-gradient(var(--sky) 50%,var(--sheet) 50%);font-family:var(--sans);color:var(--ink)}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}

/* Scene */
.hero{position:fixed;inset:0 0 auto 0;height:calc(400px + var(--top));overflow:hidden;z-index:0}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:400px}
.hero-sky{position:absolute;inset:0 0 auto 0;height:var(--top)}
.hero-text{position:absolute;left:max(24px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));top:calc(var(--top) + 22px);display:flex;justify-content:space-between;align-items:flex-start;color:#fff}
.place{font-size:13px;letter-spacing:.2em;font-weight:700;opacity:.85}
.dayno{font-family:var(--serif);font-size:58px;line-height:1;margin-top:2px}
.sub{font-size:15px;opacity:.88;margin-top:8px}
.menu-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* Sheet */
.sheet{position:relative;z-index:1;margin-top:calc(318px + var(--top));min-height:calc(100vh - 160px);background:var(--sheet);border-radius:28px 28px 0 0;padding:12px 0 calc(140px + var(--bot))}
.handle{width:40px;height:5px;border-radius:3px;background:var(--handle);margin:0 auto 14px}
.strip{display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px max(20px,env(safe-area-inset-right)) 4px max(20px,env(safe-area-inset-left));scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:center;width:58px;height:62px;border-radius:14px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--chip);border:2.5px solid transparent}
.chip b{font-size:19px;font-weight:700}
.chip span{font-size:11px;color:var(--muted);height:14px;display:flex;align-items:center}
.chip.sel{background:var(--chip-sel);border-color:var(--ink)}
.list{padding:4px max(22px,env(safe-area-inset-right)) 0 max(22px,env(safe-area-inset-left))}
.ev-title{font-family:var(--serif);font-size:23px;line-height:1.15;margin:0;padding:18px 0 4px;font-weight:400}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.circ{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--ring);transition:background .15s,border-color .15s}
.circ svg{opacity:0}
.row.on .circ{background:var(--accent);border-color:var(--accent)}
.row.on .circ svg{opacity:1}
.ref{font-size:18px;font-weight:500}
.row.on .ref{color:var(--muted)}
.row.opt .circ{border-style:dashed}
.row.opt.on .circ{border-style:solid}
.row.opt .ref{color:var(--muted);font-weight:400}
.note{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.done-msg{margin:22px 0 0;padding:16px;border-radius:16px;background:var(--chip);font-size:15px;color:var(--muted);text-align:center}

/* Floating button */
.pill{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(22px + var(--bot));background:var(--accent);color:var(--accent-ink);border-radius:30px;padding:17px 32px;font-size:17px;font-weight:700;white-space:nowrap;box-shadow:0 10px 28px rgba(12,16,40,.28);display:flex;align-items:center;gap:8px}
.fade{position:fixed;z-index:2;left:0;right:0;bottom:0;height:calc(120px + var(--bot));background:linear-gradient(to bottom,transparent,var(--sheet) 60%);pointer-events:none}

/* Menu panel */
.scrim{position:fixed;inset:0;z-index:10;background:var(--scrim)}
.panel{position:fixed;z-index:11;left:0;right:0;bottom:0;background:var(--panel);border-radius:24px 24px 0 0;padding:12px 20px calc(24px + var(--bot));display:flex;flex-direction:column;gap:6px}
.panel h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:6px 0 2px}
.panel p{margin:0 0 8px;color:var(--muted);font-size:15px;line-height:1.45}
.panel .item{text-align:left;padding:14px 4px;font-size:17px;font-weight:500;border-top:1px solid var(--line);min-height:52px}
.panel .danger{color:#C2412D}
.panel .confirm{display:flex;gap:10px;padding:8px 0}
.panel .confirm button{flex:1;padding:14px;border-radius:14px;font-weight:700;background:var(--chip)}
.panel .confirm .yes{background:#C2412D;color:#fff}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="hero" id="hero" aria-hidden="true"></div>
<div class="hero-text" style="position:fixed;z-index:0" id="heroText"></div>
<main class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="strip" id="strip" role="tablist" aria-label="Days"></div>
  <div class="list" id="list"></div>
</main>
<div class="fade"></div>
<button class="pill" id="pill" type="button"></button>
<div id="menu" hidden></div>

or=\"#4A3358\"/><stop offset=\"1\" stop-color=\"#B8707A\"/></linearGradient><radialGradient id=\"ggolgotha\"><stop offset=\"0\" stop-color=\"#FFE9C2\" stop-opacity=\".85\"/><stop offset=\"1\" stop-color=\"#FFE9C2\" stop-opacity=\"0\"/></radialGradient></defs><rect width=\"390\" height=\"400\" fill=\"url(#sgolgotha)\"/><circle cx=\"196\" cy=\"262\" r=\"57.2\" fill=\"url(#ggolgotha)\" opacity=\".6\"/><circle cx=\"196\" cy=\"262\" r=\"26\" fill=\"#FFD9A0\" opacity=\"0.55\"/><path d=\"M0 262 C60 228 110 246 160 236 C210 226 250 250 300 238 C340 230 370 244 390 238 V300 H0Z\" fill=\"#3A3557\"/><path d=\"M0 300 C90 290 140 224 196 222 C252 224 300 290 390 300 V400 H0Z\" fill=\"#2B2C47\"/><rect x=\"192.5\" y=\"140\" width=\"7\" height=\"86\" fill=\"#1C1D33\"/><rect x=\"171.0\" y=\"160.64\" width=\"50\" height=\"7\" fill=\"#1C1D33\"/><rect x=\"143.0\" y=\"180\" width=\"6\" height=\"62\" fill=\"#1C1D33\"/><rect x=\"128.0\" y=\"194.88\" width=\"36\" height=\"6\" fill=\"#1C1D33\"/><rect x=\"243.0\" y=\"180\" width=\"6\" height=\"62\" fill=\"#1C1D33\"/><rect x=\"228.0\" y=\"194.88\" width=\"36\" height=\"6\" fill=\"#1C1D33\"/><path d=\"M0 318 C90 300 190 322 280 308 C330 302 365 310 390 308 V400 H0Z\" fill=\"#1C1D33\"/>"},"theemptytomb":{"label":"THE EMPTY TOMB","svg":"<defs><linearGradient id=\"stheemptytomb\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#26305C\"/><stop offset=\".58\" stop-color=\"#9A6C93\"/><stop offset=\"1\" stop-color=\"#F6C38C\"/></linearGradient><radialGradient id=\"gtheemptytomb\"><stop offset=\"0\" stop-color=\"#FFE9C2\" stop-opacity=\".85\"/><stop offset=\"1\" stop-color=\"#FFE9C2\" stop-opacity=\"0\"/></radialGradient></defs><rect width=\"390\" height=\"400\" fill=\"url(#stheemptytomb)\"/><path d=\"M292 248 L581 168\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><path d=\"M292 248 L549 94\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><path d=\"M292 248 L499 31\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><path d=\"M292 248 L433 -17\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><path d=\"M292 248 L358 -45\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><path d=\"M292 248 L277 -52\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><path d=\"M292 248 L198 -37\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><path d=\"M292 248 L125 -1\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><path d=\"M292 248 L65 52\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><path d=\"M292 248 L21 120\" stroke=\"#FFE7C0\" stroke-opacity=\".16\" stroke-width=\"12\"/><circle cx=\"292\" cy=\"248\" r=\"74.80000000000001\" fill=\"url(#gtheemptytomb)\" opacity=\".6\"/><circle cx=\"292\" cy=\"248\" r=\"34\" fill=\"#FFD9A0\" opacity=\"0.95\"/><path d=\"M0 262 C60 228 110 246 160 236 C210 226 250 250 300 238 C340 230 370 244 390 238 V300 H0Z\" fill=\"#3A3557\"/><path d=\"M20 330 C34 250 116 214 186 228 C226 236 246 270 246 330Z\" fill=\"#2B2C47\"/><path d=\"M112 330 V294 a26 26 0 0 1 52 0 V330Z\" fill=\"#0F1022\"/><circle cx=\"212\" cy=\"308\" r=\"26\" fill=\"#4A4568\" stroke=\"#1C1D33\" stroke-width=\"3\"/><path d=\"M0 318 C90 300 190 322 280 308 C330 302 365 310 390 308 V400 H0Z\" fill=\"#1C1D33\"/><path d=\"M322 330 c0 -20 6 -30 14 -36 m-14 36 c-4 -18 -14 -26 -22 -28 m22 28 c6 -12 18 -16 26 -14\" stroke=\"#1C1D33\" stroke-width=\"3\" fill=\"none\"/>"}},"dayScene":["bethlehem","bethlehem","bethlehem","bethlehem","thejordan","thejordan","galilee","galilee","galilee","galilee","galilee","galilee","galilee","jerusalem","galilee","galilee","galilee","galilee","galilee","galilee","galilee","galilee","galilee","galilee","themountain","galilee","galilee","jerusalem","jerusalem","jerusalem","galilee","galilee","galilee","galilee","theroad","theroad","theroad","theroad","theroad","theroad","theroad","jerusalem","jerusalem","jerusalem","jerusalem","jerusalem","jerusalem","jerusalem","jerusalem","jerusalem","jerusalem","gethsemane","gethsemane","gethsemane","gethsemane","golgotha","golgotha","theemptytomb","theemptytomb","theemptytomb"]};
const KEY = "gospels-in-order-progress-v1";
const TICK = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dash = r => r.replace(/-/g, "–");

// Stable key per reading: survives any later change to how days are grouped
PLAN.forEach(day => day.e.forEach(ev => ev.rd.forEach(r => { r.key = r[0] + " " + r[1] + "|" + ev.n; })));
const isRep = r => r[2].length > 0;
const required = d => PLAN[d-1].e.flatMap(ev => ev.rd.filter(r => !isRep(r)));

let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const dayDone = d => required(d).every(r => done[r.key]);
const nextDay = () => { for (let d = 1; d <= 60; d++) if (!dayDone(d)) return d; return 60; };
const allDone = () => PLAN.every(d => dayDone(d.d));

let view = nextDay();
let lastScene = null;

function readOn(r, today){
  const ds = r[2];
  if (ds.length === 1 && ds[0] === today) return "Read earlier today · optional";
  return "Read on Day" + (ds.length > 1 ? "s " + ds.join(" & ") : " " + ds[0]) + " · optional";
}

function renderHero(){
  const key = SCENES.dayScene[view-1], sc = SCENES.scenes[key];
  if (key !== lastScene){
    document.getElementById("hero").innerHTML =
      `<div class="hero-sky" style="background:${sc.svg.match(/stop-color="(#[0-9A-Fa-f]{6})"/)[1]}"></div>` +
      `<svg viewBox="0 0 390 400" preserveAspectRatio="xMidYMax slice">${sc.svg}</svg>`;
    document.documentElement.style.setProperty("--sky", sc.svg.match(/stop-color="(#[0-9A-Fa-f]{6})"/)[1]);
    lastScene = key;
  }
  const v = PLAN[view-1].v;
  document.getElementById("heroText").innerHTML =
    `<div><div class="place">${sc.label}</div><div class="dayno">Day ${view}</div><div class="sub">of 60 · ${v} verses · about ${Math.max(5, Math.round(v/5))} min</div></div>` +
    `<button class="menu-btn" id="menuBtn" type="button" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>`;
  document.getElementById("menuBtn").onclick = openMenu;
}

function renderStrip(scroll){
  const cur = nextDay();
  const strip = document.getElementById("strip");
  strip.innerHTML = PLAN.map(d => {
    const f = dayDone(d.d), sel = d.d === view;
    const sub = f ? TICK : (d.d === cur && !allDone() ? "Today" : "&nbsp;");
    return `<button class="chip${sel ? " sel" : ""}" type="button" role="tab" aria-selected="${sel}" aria-label="Day ${d.d}${f ? ", done" : ""}" data-d="${d.d}"><b>${d.d}</b><span>${sub}</span></button>`;
  }).join("");
  if (scroll){
    const el = strip.querySelector(".sel");
    strip.scrollLeft = el.offsetLeft - strip.clientWidth/2 + el.offsetWidth/2;
  }
}

function renderList(){
  let html = "";
  PLAN[view-1].e.forEach(ev => {
    html += `<h3 class="ev-title">${esc(ev.n)}</h3>`;
    ev.rd.forEach(r => {
      const on = !!done[r.key], rep = isRep(r);
      html += `<button type="button" class="row${on ? " on" : ""}${rep ? " opt" : ""}" aria-pressed="${on}" data-k="${esc(r.key)}">` +
        `<span class="circ" style="color:var(--accent-ink)">${TICK}</span>` +
        `<span><span class="ref">${r[0]} ${dash(r[1])}</span>${rep ? `<span class="note">${readOn(r, view)}</span>` : ""}</span></button>`;
    });
  });
  if (view === 60 && allDone()) html += `<div class="done-msg">You've read all four Gospels in order. Well done.</div>`;
  document.getElementById("list").innerHTML = html;
}

function renderPill(){
  const pill = document.getElementById("pill");
  if (!dayDone(view)) { pill.innerHTML = `Mark Day ${view} Complete`; pill.dataset.act = "mark"; }
  else if (view < 60) { pill.innerHTML = `${TICK} On to Day ${view+1}`; pill.dataset.act = "next"; }
  else { pill.innerHTML = `${TICK} Plan complete`; pill.dataset.act = "none"; }
}

function render(scrollStrip){ renderHero(); renderStrip(scrollStrip); renderList(); renderPill(); }

function go(d){ view = Math.min(60, Math.max(1, d)); render(true); window.scrollTo({top:0, behavior:"smooth"}); }

document.getElementById("list").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const k = row.dataset.k;
  if (done[k]) delete done[k]; else done[k] = 1;
  save(); render(false);
});
document.getElementById("strip").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (c) go(+c.dataset.d);
});
document.getElementById("pill").addEventListener("click", e => {
  const act = e.currentTarget.dataset.act;
  if (act === "mark"){ required(view).forEach(r => done[r.key] = 1); save(); render(false); }
  else if (act === "next") go(view + 1);
});

function openMenu(){
  const n = PLAN.filter(d => dayDone(d.d)).length;
  const m = document.getElementById("menu");
  m.hidden = false;
  m.innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="panel" role="dialog" aria-label="Menu">
      <div class="handle" style="margin-bottom:4px"></div>
      <h2>Gospels in Order</h2>
      <div class="bar"><i style="width:${n/60*100}%"></i></div>
      <p>${n} of 60 days complete. Your progress is saved on this phone and works without internet.</p>
      <button class="item" type="button" id="mNext">Go to my next day (Day ${nextDay()})</button>
      <button class="item" type="button" id="mFirst">Go to Day 1</button>
      <div id="resetArea"><button class="item danger" type="button" id="mReset" style="width:100%">Start over</button></div>
    </div>`;
  const close = () => { m.hidden = true; m.innerHTML = ""; };
  document.getElementById("scrim").onclick = close;
  document.getElementById("mNext").onclick = () => { close(); go(nextDay()); };
  document.getElementById("mFirst").onclick = () => { close(); go(1); };
  document.getElementById("mReset").onclick = () => {
    document.getElementById("resetArea").innerHTML = `<p style="margin-top:10px">Clear every checkmark and start again at Day 1?</p>
      <div class="confirm"><button type="button" id="no">Cancel</button><button type="button" class="yes" id="yes">Clear progress</button></div>`;
    document.getElementById("no").onclick = close;
    document.getElementById("yes").onclick = () => { done = {}; save(); close(); go(1); };
  };
}

render(true);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
